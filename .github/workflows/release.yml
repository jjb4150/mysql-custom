name: Release

# 发布流程：
#   1. 打 tag:  git tag v1.0.0 && git push origin v1.0.0
#   2. 本 workflow 自动构建、打包、发布到 VS Code Marketplace 和 Open VSX
#
# 两种 marketplace 认证方式，按你配置的来（见 docs/RELEASING.md）：
#
#   A) Trusted Publishing（推荐，无需任何 secret）
#      在 marketplace.visualstudio.com/manage 的 publisher 页 → Trusted Publishing
#      建一条策略，Repository owner / Repository / Workflow 填本仓库与 release.yml。
#      然后下面的 VS_MARKETPLACE_TRUSTED_PUBLISHING 保持为 true 即可。
#
#   B) PAT（传统方式）
#      在仓库 Settings → Secrets 里配置 VSCE_PAT 和 OVSX_PAT，
#      并把 VS_MARKETPLACE_TRUSTED_PUBLISHING 改成 false。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建打包，不发布"
        type: boolean
        default: true

permissions:
  # 必须是 write：创建 Release、上传 vsix 附件都需要
  contents: write
  # Trusted Publishing 需要 OIDC 换取 Marketplace 凭据，必须开这个
  id-token: write

env:
  # vsce 版本必须 >= 4：2.x 没有 --oidc 参数，收到它会打印
  # "error: unknown option '--oidc'" 却仍然返回退出码 0，
  # 导致 CI 显示成功而实际什么都没发布。
  VSCE_VERSION: "4.1.0"
  # 改成 true 就走 Trusted Publishing，不需要任何 secret
  VS_MARKETPLACE_TRUSTED_PUBLISHING: "true"
  # 是否同时发布到 Open VSX（需要 OVSX_PAT）
  PUBLISH_TO_OPENVSX: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json 已提交，用 npm ci 做可复现安装。
      # 之前用 npm install 且没有 lock 文件，setup-node 的 cache: npm 会直接失败。
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 注意：不要再单独跑 webpack。
      # package.json 里有 "vscode:prepublish": "npm run build"，
      # vsce package / vsce publish 会自动触发它。之前 workflow 先手动 build 一次、
      # 然后 vsce 又 build 一次，在 CI 上是两次完整 webpack 构建，
      # Package VSIX 这一步因此失败。只保留 tsc 做类型门禁即可。
      - name: Type check
        run: npx tsc --noEmit

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: |
          # 显式建目录：vsce 不会自动创建 -o 指定的父目录，CI 上 dist/ 并不存在
          mkdir -p dist
          npx --yes @vscode/vsce@$VSCE_VERSION package \
            --no-dependencies \
            --allow-missing-repository \
            -o "dist/${{ github.event.repository.name }}-${{ steps.ver.outputs.version }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

      # ---------- 发布到 VS Code Marketplace ----------
      #
      # continue-on-error: 市场发布失败不应连累 GitHub Release。
      # 首次发布前需要先在 publisher 后台建 Trusted Publishing 策略，
      # 没建时这一步必然失败；但用户仍然应该能从 Releases 下载 vsix 手动安装。
      # 失败状态在 workflow 里可见，不会被静默吞掉。

      - name: Publish to VS Code Marketplace (Trusted Publishing)
        if: ${{ env.VS_MARKETPLACE_TRUSTED_PUBLISHING == 'true' && github.event_name == 'push' }}
        run: |
          set -euo pipefail
          out=$(npx --yes @vscode/vsce@$VSCE_VERSION publish --oidc --packagePath dist/*.vsix 2>&1) || {
            echo "$out"; exit 1;
          }
          echo "$out"
          # vsce 2.x 收到 --oidc 时会打印 "error: unknown option '--oidc'" 但退出码仍为 0。
          # 这里显式拦一次，避免"绿了但什么都没发布"。只匹配确凿的错误形态，
          # 不做宽泛的 /error/ —— 正常输出里也可能出现这个词。
          if echo "$out" | grep -qiE "unknown option|^error:|ERROR +Extension"; then
            echo "::error::vsce reported an error despite exit code 0"
            exit 1
          fi

      - name: Publish to VS Code Marketplace (PAT)
        if: ${{ env.VS_MARKETPLACE_TRUSTED_PUBLISHING != 'true' && github.event_name == 'push' }}
        run: npx --yes @vscode/vsce@$VSCE_VERSION publish --packagePath dist/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # ---------- 发布到 Open VSX ----------

      - name: Publish to Open VSX
        if: ${{ env.PUBLISH_TO_OPENVSX == 'true' && github.event_name == 'push' }}
        run: npx --yes ovsx publish dist/*.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # ---------- 创建 GitHub Release ----------
      #
      # 这一步是为了让用户能直接从 Releases 页面下载 vsix 手动安装。
      # 之前只有 upload-artifact，那是 CI 内部构建产物、会自动过期，
      # 不会出现在 Releases 页面上，所以用户看不到任何下载入口。
      #
      # 放在发布之后：市场发布失败时不挂 Release，避免出现「能下载但市场没有」
      # 的错位状态。如果想把 vsix 先挂出来（发布失败也无所谓），把这一步上移即可。
      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            ## MySQL Custom ${{ steps.ver.outputs.version }}

            一个专注 MySQL / MariaDB 的 VS Code 扩展，针对超长复杂 SQL 做了专项优化。

            ### 安装方式

            **方式一：命令行（推荐）**

            ```bash
            code --install-extension ${{ github.event.repository.name }}-${{ steps.ver.outputs.version }}.vsix
            ```

            **方式二：VS Code 界面**

            1. 下载下面的 `.vsix` 文件
            2. VS Code 里按 `Ctrl+Shift+P`
            3. 输入 `Extensions: Install from VSIX...` 并选择刚下载的文件

            ### 说明

            - 本版本基于 [cweijan/vscode-database-client](https://github.com/cweijan/vscode-database-client) v3.9.8 (MIT) 二次开发
            - 若已上架 VS Code Marketplace，也可以直接在扩展市场搜索安装
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}